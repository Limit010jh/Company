<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DEV. - Professional Web Development & UI/UX Design Agency.">
    <title>Professional Web Development & Design</title>
    <link rel="icon" type="image/x-icon" href="Vetor LS Initial logo template vector do Stock _ Adobe Stock.jpeg">
    <link rel="stylesheet" href="Web.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <section id="contact">
        <div class="section-header reveal">
            <span class="section-tag">Let's Connect</span>
            <h2 class="section-title">Start a Conversation</h2>
        </div>

        <div class="contact-container reveal">
            <div class="contact-info">
                <h3>Have a project in mind?</h3>
                <p>Drop us a line and let's explore how we can turn your ideas into a pixel-perfect reality.</p>
                <div class="contact-details">
                    <div class="contact-item">
                        <div class="contact-icon"><i class="fa-solid fa-envelope"></i></div>
                        <div class="contact-text">
                            <h4>Email</h4>
                            <p>hello@limitdev.com</p>
                        </div>
                    </div>
                </div>
            </div>

            <form class="contact-form" id="project-contact-form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="e.g. John Doe" required>
                </div>
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="e.g. john@example.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" class="form-input" placeholder="Describe your web project requirements..." required></textarea>
                </div>
                <button type="submit" class="btn-submit">
                    Send Message <i class="fa-solid fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 DEV. All rights reserved.</p>
        </div>
    </footer>

    <script src="active.js"></script>
</body>
</html>
